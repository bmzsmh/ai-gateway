name: Deploy to Cloudflare Workers

on:
  workflow_dispatch: # 允许手动触发
  # push:
  #   branches:
  #     - main

# 部署所需权限
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate wrangler.toml with admin credentials
        run: |
          DEFAULT_URLS=(
            "https://opencode.ai.cmliussss.net/zen/v1"
            "https://opencode.fastly.cmliussss.net/zen/v1"
            "https://opencode.gcore.cmliussss.net/zen/v1"
          )
          MIRRORS_URL=$(printf '%s\\n' "${DEFAULT_URLS[@]}" | sed '$s/\\n$//')
          EXTRA_URLS="${{ vars.OPENCODE_MIRRORS_URL }}"
          if [ -n "$EXTRA_URLS" ]; then
            MIRRORS_URL="${MIRRORS_URL}\\n${EXTRA_URLS}"
          fi
          ADMIN_USERNAME_VAR="${{ vars.ADMIN_USERNAME }}"
          ADMIN_PASSWORD_VAR="${{ vars.ADMIN_PASSWORD }}"
          cat > wrangler.toml << EOF
          name = "ai-gateway"
          main = "src/index.ts"
          compatibility_date = "2025-07-01"
          compatibility_flags = ["nodejs_compat"]
          keep_vars = true

          [[kv_namespaces]]
          binding = "KV"
          id = "${{ vars.KV_NAMESPACE_ID }}"

          [vars]
          OPENCODE_MIRRORS_URL = "${MIRRORS_URL}"
          EOF
          # 仅在配置了 admin 凭据变量时追加（避免空值破坏 TOML）
          if [ -n "$ADMIN_USERNAME_VAR" ] && [ -n "$ADMIN_PASSWORD_VAR" ]; then
            cat >> wrangler.toml << EOF
          ADMIN_USERNAME = "${ADMIN_USERNAME_VAR}"
          ADMIN_PASSWORD = "${ADMIN_PASSWORD_VAR}"
          EOF
            echo "admin vars 已写入 (条件配置)"
          else
            echo "admin vars 未配置，跳过（运行时凭据由 wrangler secret put 独立管理）"
          fi

      - name: Build (dry-run)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}